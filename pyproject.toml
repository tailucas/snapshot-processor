[project]
name = "app"
version = "0.1.0"
description = "Snapshot Processor applications"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Tai Lucas", email = "tglucas@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "awscli>=1.42.35",
    "cachetools>=6.2.0",
    "pydrive2>=1.21.3",
    "pyftpdlib>=2.0.1",
    "tailucas-pylib[aws,creds,monitoring,mq]>=0.7.8",
    "watchdog>=6.0.0",
]

[dependency-groups]
coding = [
    "pillow>=12.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.90",
]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.18.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
gauth_configure = "app.gauth_configure:main"
aws_configure = "tailucas_pylib.tools.aws_configure:main"
config_interpol = "tailucas_pylib.tools.config_interpol:main"
cred_tool = "tailucas_pylib.tools.cred_tool:main"
yaml_interpol = "tailucas_pylib.tools.yaml_interpol:main"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tailucas_pylib"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
