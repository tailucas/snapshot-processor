# Runtime contract for this stack. It carries no credentials: the app resolves
# them at runtime via tailucas_pylib.creds, which needs OP_CONNECT_HOST,
# OP_CONNECT_TOKEN and OP_VAULT in `.env` (mode 0600).
#
# Compose `secrets:` is deliberately NOT used. It resolves OP_* from the
# exporting shell, so `docker compose up` only worked for a human with the
# tokens in their environment -- an unattended deploy runner has none.
#
# Verify by whether the app answers / logs, never by `ss -ltn`: docker-proxy
# accepts every published port whether or not anything sits behind it.
services:
  app:
    env_file: ".env"
    image: "${CONTAINER_NAME}"
    restart: unless-stopped
    stop_grace_period: 45s
    build:
      context: .
      args:
        LANG: "${LANG:-en_ZA.UTF-8}"
        LANGUAGE: "${LANGUAGE:-en_ZA}"
    logging:
      driver: "local"
      options:
        tag: "{{.Name}}"
    tmpfs:
    - /tmp
    hostname: ${DEVICE_NAME:-snapshot-processor}
    ports:
      - "21:21"
      # FTP passive (PASV) data ports; keep in step with FTP_PASV_MIN/MAX_PORT
      - "30000-30009:30000-30009"
      # pydrive2
      - "8080:8080"
      - "8090:8090"
    volumes:
      - ./data:/data
    extra_hosts:
        - "host.docker.internal:host-gateway"
